[workspace]
resolver = "2"
members = ["core", "src-tauri"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

# Vendored with one fix: always run BLE service discovery on connect, even
# when BlueZ still holds a connection from a previous app run (upstream skips
# it then and fails with InvalidEndpoint("rx") on every quick app restart).
# Drop once upstream buttplug releases a fix.
[patch.crates-io]
buttplug_server_hwmgr_btleplug = { path = "vendor/buttplug_server_hwmgr_btleplug" }

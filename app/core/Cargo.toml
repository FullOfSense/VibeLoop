[package]
name = "vibeloop-core"
version = "0.7.0"
edition = "2021"

[features]
default = ["device"]
# buttplug client (pure Rust, talks to an engine over a local websocket).
device = ["dep:buttplug", "dep:buttplug_core"]
# Embedded intiface-engine (pulls in btleplug; needs libdbus/libudev on Linux).
engine = ["dep:intiface-engine"]

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

buttplug = { version = "10", optional = true }
buttplug_core = { version = "10", optional = true }
intiface-engine = { version = "4", optional = true, default-features = false }
iroh = "1"
tokio-util = { version = "0.7", features = ["codec"] }
mlua = { version = "0.11", features = ["lua54", "vendored", "serialize", "send", "error-send"] }
tokio-tungstenite = "0.29"
futures-util = "0.3"
blake3 = "1"
rand = "0.8"
data-encoding = "2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls"] }
rosc = "0.11.4"

[dev-dependencies]
tracing-subscriber = { workspace = true }
